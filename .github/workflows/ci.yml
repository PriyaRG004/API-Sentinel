name: API Sentinel CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test-backend:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: backend
        run: |
          pytest


  build-backend:

    runs-on: ubuntu-latest

    needs: test-backend

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -t api-sentinel-backend ./backend


  build-frontend:

    runs-on: ubuntu-latest

    needs: test-backend

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: |
          docker build -t api-sentinel-frontend ./frontend