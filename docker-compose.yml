services:
  db:
    image: postgres:16
    container_name: api-sentinel-db
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: api_sentinel
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: api-sentinel-backend
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: api-sentinel-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data: